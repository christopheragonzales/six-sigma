[project]
name = "six-sigma"
version = "0.1.0"
description = "Project to handle generating Lean Six Sigma Products"
readme = "README.md"
authors = [
    { name = "Chris Gonzales", email = "christopher.anthony.gonzales@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "polars>=2.2.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[project.scripts]
six-sigma = "six_sigma:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
